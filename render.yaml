services:
  - type: web
    name: obd2-diagnostic-app
    runtime: node
    runtimeVersion: 18
    buildCommand: npm run build
    startCommand: NODE_ENV=production node server/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: RENDER
        value: "true"
      - key: VITE_API_URL
        scope: build
        value: https://obd2-diagnostic-app.onrender.com
    healthCheckPath: /health
    healthCheckInterval: 10
    healthCheckTimeout: 5
    maxInstanceCount: 1
    preDeployCommand: npm run build:client && npm run build:server
